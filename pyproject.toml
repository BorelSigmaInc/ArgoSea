[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argosea"
version = "0.4.0"
description = "ArgoSea: provably correct maritime decision-making platform"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["config", "src", "src.ingestion", "src.verification", "src.quantum", "src.api", "src.monitoring"]

[tool.setuptools.package-dir]
"" = "."
